<!doctype html>
<html lang="th">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>หมวดหมู่สินค้า - KAIYANG SHOP</title>
		<link href="style.css" rel="stylesheet" />
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="scripts/category.js" type="module"></script>
	</head>
	<body>
		<!-- ================= NAVBAR ================= -->
		<header class="navbar">
			<div class="logo"><a href="index.html" class="text-[#ff6b35] no-underline">KAIYANG SHOP</a></div>
			<nav>
				<ul class="nav-links">
					<li><a href="index.html">หน้าแรก</a></li>
					<li><a href="category.html">สินค้าทั้งหมด</a></li>
					<li><a href="cart.html">ตะกร้าสินค้า</a></li>
					<li><a href="#">ติดต่อเรา</a></li>
				</ul>
			</nav>
			<div class="nav-right">
				<input type="text" placeholder="ค้นหาสินค้า" id="search-input" />
				<button class="login-btn">
					<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
						<rect width="24" height="24" fill="none" />
						<path fill="currentColor" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14" />
					</svg>
				</button>
				<a href="cart.html" class="register-btn relative" id="cart-btn">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
						<rect width="24" height="24" fill="none" />
						<path fill="currentColor" d="M17 18c-1.11 0-2 .89-2 2a2 2 0 0 0 2 2a2 2 0 0 0 2-2a2 2 0 0 0-2-2M1 2v2h2l3.6 7.59l-1.36 2.45c-.15.28-.24.61-.24.96a2 2 0 0 0 2 2h12v-2H7.42a.25.25 0 0 1-.25-.25q0-.075.03-.12L8.1 13h7.45c.75 0 1.41-.42 1.75-1.03l3.58-6.47c.07-.16.12-.33.12-.5a1 1 0 0 0-1-1H5.21l-.94-2M7 18c-1.11 0-2 .89-2 2a2 2 0 0 0 2 2a2 2 0 0 0 2-2a2 2 0 0 0-2-2" />
					</svg>
					ตะกร้าสินค้า
					<span id="cart-badge" class="hidden absolute -top-2 -right-2 min-w-[1.25rem] h-5 px-1 rounded-full bg-red-500 text-white text-xs font-bold flex items-center justify-center leading-none">0</span>
				</a>
			</div>
		</header>

		<!-- ================= BREADCRUMB ================= -->
		<nav class="px-10 py-4 text-sm flex items-center gap-2 text-[#9a9ab0]" style="background: var(--bg-dark);">
			<a href="index.html" class="hover:text-[#ff6b35] transition">หน้าแรก</a>
			<span>›</span>
			<span id="breadcrumb-current" class="text-[#f0f0f0]">หมวดหมู่ทั้งหมด</span>
		</nav>

		<!-- ================= CATEGORY HEADER ================= -->
		<section id="category-header" class="hidden px-10 py-8" style="background: var(--gradient-hero);">
			<div class="flex items-center gap-6 max-w-5xl mx-auto">
				<img id="category-img" src="" alt="" class="w-24 h-24 rounded-xl object-cover border border-[rgba(255,255,255,0.08)]" />
				<div>
					<h1 id="category-name" class="text-2xl font-bold text-[#f0f0f0]"></h1>
					<p id="category-desc" class="text-[#9a9ab0] mt-1"></p>
				</div>
			</div>
		</section>

		<!-- ================= PRODUCTS GRID ================= -->
		<section class="px-10 py-8" style="background: var(--bg-dark); min-height: 60vh;">
			<h2 class="section-title" id="section-title">สินค้าทั้งหมด</h2>
			<div class="category-grid" id="product-grid">
				<!-- populated by JS -->
			</div>
		</section>

		<!-- ================= FOOTER ================= -->
		<footer class="footer">
			<p>© 2026 KAIYANG SHOP - All Rights Reserved</p>
		</footer>

		<!-- ================= TOAST ================= -->
		<div id="cart-toast" popover="manual" class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] m-0 rounded-xl bg-green-600 px-5 py-3 text-white shadow-xl text-sm font-medium">
			<div class="flex items-center gap-3">
				<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
					<polyline points="20 6 9 17 4 12" />
				</svg>
				<span id="cart-toast-text">เพิ่มสินค้าลงตะกร้าแล้ว!</span>
			</div>
		</div>
	</body>
</html>
