<!doctype html>
<html lang="th">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>รายละเอียดสินค้า - KAIYANG SHOP</title>
		<link href="style.css" rel="stylesheet" />
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="scripts/product.js" type="module"></script>
	</head>
	<body>
		<!-- ================= NAVBAR ================= -->
		<header class="navbar">
			<div class="logo">
				<a href="index.html" class="text-[#ff6b35] no-underline"
					>KAIYANG SHOP</a
				>
			</div>
			<nav>
				<ul class="nav-links">
					<li><a href="index.html">หน้าแรก</a></li>
					<li><a href="category.html">สินค้าทั้งหมด</a></li>
					<li><a href="cart.html">ตะกร้าสินค้า</a></li>
					<li><a href="#">ติดต่อเรา</a></li>
				</ul>
			</nav>
			<div class="nav-right">
				<a href="cart.html" class="register-btn relative" id="cart-btn">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="20"
						height="20"
						viewBox="0 0 24 24"
					>
						<rect width="24" height="24" fill="none" />
						<path
							fill="currentColor"
							d="M17 18c-1.11 0-2 .89-2 2a2 2 0 0 0 2 2a2 2 0 0 0 2-2a2 2 0 0 0-2-2M1 2v2h2l3.6 7.59l-1.36 2.45c-.15.28-.24.61-.24.96a2 2 0 0 0 2 2h12v-2H7.42a.25.25 0 0 1-.25-.25q0-.075.03-.12L8.1 13h7.45c.75 0 1.41-.42 1.75-1.03l3.58-6.47c.07-.16.12-.33.12-.5a1 1 0 0 0-1-1H5.21l-.94-2M7 18c-1.11 0-2 .89-2 2a2 2 0 0 0 2 2a2 2 0 0 0 2-2a2 2 0 0 0-2-2"
						/>
					</svg>
					ตะกร้าสินค้า
					<span
						id="cart-badge"
						class="hidden absolute -top-2 -right-2 min-w-[1.25rem] h-5 px-1 rounded-full bg-red-500 text-white text-xs font-bold flex items-center justify-center leading-none"
						>0</span
					>
				</a>
			</div>
		</header>

		<!-- ================= BREADCRUMB ================= -->
		<nav
			class="px-10 py-4 text-sm flex items-center gap-2 text-[#9a9ab0]"
			style="background: var(--bg-dark)"
		>
			<a href="index.html" class="hover:text-[#ff6b35] transition"
				>หน้าแรก</a
			>
			<span>›</span>
			<a
				id="breadcrumb-cat"
				href="category.html"
				class="hover:text-[#ff6b35] transition"
				>หมวดหมู่</a
			>
			<span>›</span>
			<span id="breadcrumb-current" class="text-[#f0f0f0]">สินค้า</span>
		</nav>

		<!-- ================= PRODUCT DETAIL ================= -->
		<section
			class="px-10 py-10"
			style="background: var(--bg-dark); min-height: 70vh"
		>
			<div
				id="product-detail"
				class="max-w-4xl mx-auto flex flex-col md:flex-row gap-8"
			>
				<!-- Left: Image -->
				<div class="flex-shrink-0">
					<img
						id="product-img"
						src=""
						alt=""
						class="w-full md:w-80 h-64 md:h-80 rounded-2xl object-cover border border-[rgba(255,255,255,0.08)]"
						style="background: var(--gradient-card)"
					/>
				</div>

				<!-- Right: Info -->
				<div class="flex-1 flex flex-col gap-4">
					<h1
						id="product-name"
						class="text-3xl font-bold text-[#f0f0f0]"
					></h1>
					<p
						id="product-desc"
						class="text-[#9a9ab0] text-base leading-relaxed"
					></p>

					<div class="flex items-center gap-6 mt-2">
						<span
							id="product-price"
							class="text-3xl font-bold text-[#ffd700]"
						></span>
					</div>

					<div
						class="flex items-center gap-6 text-sm text-[#9a9ab0] mt-1"
					>
						<span
							>📦 คงเหลือ:
							<span
								id="product-stock"
								class="text-[#f0f0f0] font-semibold"
							></span>
							ชิ้น</span
						>
						<span
							>🔥 ขายแล้ว:
							<span
								id="product-sold"
								class="text-[#ff6b35] font-semibold"
							></span>
							ชิ้น</span
						>
					</div>

					<div class="flex gap-3 mt-6">
						<button
							id="add-to-cart-btn"
							class="flex-1 py-3 rounded-xl font-semibold text-white text-base transition-all active:scale-95 cursor-pointer"
							style="background: var(--primary)"
						>
							🛒 เพิ่มลงตะกร้า
						</button>
						<a
							href="cart.html"
							class="flex-1 py-3 rounded-xl font-semibold text-center text-[#ff6b35] text-base border border-[#ff6b35] hover:bg-[rgba(255,107,53,0.12)] transition no-underline"
						>
							ไปที่ตะกร้า
						</a>
					</div>
				</div>
			</div>

			<!-- Loading / Error -->
			<div id="product-loading" class="text-center py-20 text-[#9a9ab0]">
				กำลังโหลดข้อมูลสินค้า...
			</div>
			<div
				id="product-error"
				class="hidden text-center py-20 text-red-400"
			>
				ไม่พบสินค้านี้
			</div>
		</section>

		<!-- ================= FOOTER ================= -->
		<footer class="footer">
			<p>© 2026 KAIYANG SHOP - All Rights Reserved</p>
		</footer>

		<!-- ================= TOAST ================= -->
		<div
			id="cart-toast"
			popover="manual"
			class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] m-0 rounded-xl bg-green-200 px-5 py-3 text-slate-800 shadow-xl text-sm font-medium"
		>
			<div class="flex items-center gap-3">
				<svg
					xmlns="http://www.w3.org/2000/svg"
					class="h-5 w-5 shrink-0"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2.5"
					stroke-linecap="round"
					stroke-linejoin="round"
				>
					<polyline points="20 6 9 17 4 12" />
				</svg>
				<span id="cart-toast-text">เพิ่มสินค้าลงตะกร้าแล้ว!</span>
			</div>
		</div>
	</body>
</html>
